<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    {% assign asset_v = site.time | date: '%s' %}
    <link rel="preload" href="{{ '/assets/js/game.js' | relative_url }}?v={{ asset_v }}" as="script">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_v }}">
    {% seo %}
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <meta name="theme-color" content="#ffffff">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "{{ site.title }}",
      "description": "{{ site.description | strip_newlines }}",
      "url": "{{ site.url }}/",
      "genre": "Endless Runner",
      "gamePlatform": "Web Browser",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "author": { "@type": "Person", "name": "{{ site.author.name }}" },
      "image": "{{ site.url }}/assets/images/og-image.png"
    }
    </script>
  </head>
  <body>
    {{ content }}
    <script src="{{ '/assets/js/game.js' | relative_url }}?v={{ asset_v }}" defer></script>
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a7c876b42c744572810f85335a8e8343"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
