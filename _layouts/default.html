<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    {% assign asset_v = site.time | date: '%s' %}
    <link rel="preload" href="{{ '/assets/js/game.js' | relative_url }}?v={{ asset_v }}" as="script">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_v }}">
    {% seo %}
  </head>
  <body>
    {{ content }}
    <script src="{{ '/assets/js/game.js' | relative_url }}?v={{ asset_v }}" defer></script>
  </body>
</html>
